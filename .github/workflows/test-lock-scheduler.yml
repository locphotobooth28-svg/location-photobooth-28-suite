name: Test verrouillage LP28

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/boothLockScheduler.js'
      - 'scripts/test-booth-lock-scheduler.js'
      - 'scripts/test-lock-pin-server-contract.js'
      - 'scripts/patch-booth-lock-schedule.js'
      - 'scripts/patch-booth-lock-ui-v2.js'
      - 'scripts/patch-booth-status-fix.js'
      - 'scripts/patch-booth-power-client.js'
      - 'scripts/fix-booths-pro-dashboard-syntax.js'
      - 'scripts/patch-booths-pro-dashboard.js'
      - 'server.js'
      - 'client/src/App.jsx'
      - 'package.json'
      - '.github/workflows/test-lock-scheduler.yml'

jobs:
  simulation:
    name: Simuler verrouillage LP28
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer uniquement Luxon pour le moteur de simulation
        run: npm install --no-save --ignore-scripts luxon@3.7.2
      - name: Executer les simulations
        run: node scripts/test-booth-lock-scheduler.js
      - name: Verifier le contrat PIN serveur vers Agent
        run: node scripts/test-lock-pin-server-contract.js
      - name: Verifier la syntaxe du patch interface V2
        run: node --check scripts/patch-booth-lock-ui-v2.js
      - name: Verifier le raccordement du patch V2 au build
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const build=String(pkg.scripts?.build||'');
          const pro='node scripts/patch-booths-pro-dashboard.js';
          const v2='node scripts/patch-booth-lock-ui-v2.js';
          if(!build.includes(v2)) throw new Error('patch-booth-lock-ui-v2.js absent du build');
          if(build.indexOf(v2)<=build.indexOf(pro)) throw new Error('le patch V2 doit passer apres le dashboard Mes Bornes');
          console.log('LP28 interface verrouillage V2: syntaxe et ordre build valides');
          NODE
      - name: Simuler la chaine reelle des patches Mes Bornes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-booth-status-fix.js
          node scripts/patch-booth-power-client.js
          node scripts/patch-booth-lock-schedule.js
          node scripts/fix-booths-pro-dashboard-syntax.js
          node scripts/patch-booths-pro-dashboard.js
          node scripts/patch-booth-lock-ui-v2.js
          node - <<'NODE'
          const fs=require('fs');
          const server=fs.readFileSync('server.js','utf8');
          const app=fs.readFileSync('client/src/App.jsx','utf8');
          const checks=[
            [server.includes('/api/admin/booths/:boothName/lock-schedules'),'API lock-schedules absente après patches'],
            [server.includes('/api/booth-agent/control'),'endpoint Agent absent après patches'],
            [server.includes('schedules:Array.isArray(p?.lockScreen?.schedules)?p.lockScreen.schedules:[]'),'schedules non conservés dans readBoothControl'],
            [app.includes('function LP28LockScheduleEditor('),'éditeur V2 absent après patches'],
            [app.includes("{boothTab==='LOCK'&&<LP28LockScheduleEditor"),'panneau Verrouillage non raccordé à V2'],
            [app.includes('＋ Ajouter un créneau'),'bouton Ajouter un créneau absent'],
            [app.includes('Récurrent chaque semaine'),'mode hebdomadaire absent']
          ];
          for(const [ok,msg] of checks) if(!ok) throw new Error(msg);
          console.log('LP28 chaine réelle des patches Mes Bornes: OK');
          NODE
