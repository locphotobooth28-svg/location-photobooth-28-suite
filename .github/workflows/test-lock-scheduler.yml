name: Test verrouillage LP28

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/boothLockScheduler.js'
      - 'scripts/test-booth-lock-scheduler.js'
      - 'scripts/test-lock-pin-server-contract.js'
      - 'scripts/patch-booth-lock-schedule.js'
      - 'scripts/patch-booth-lock-ui-v2.js'
      - 'scripts/patch-lock-schedule-save-confirm.js'
      - 'scripts/patch-lock-sync-runtime.js'
      - 'scripts/patch-booth-status-fix.js'
      - 'scripts/patch-booth-power-client.js'
      - 'scripts/fix-booths-pro-dashboard-syntax.js'
      - 'scripts/patch-booths-pro-dashboard.js'
      - 'server.js'
      - 'client/src/App.jsx'
      - 'package.json'
      - '.github/workflows/test-lock-scheduler.yml'

jobs:
  simulation:
    name: Simuler verrouillage LP28 V3
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer uniquement Luxon pour le moteur de simulation
        run: npm install --no-save --ignore-scripts luxon@3.7.2
      - name: Executer les simulations existantes
        run: node scripts/test-booth-lock-scheduler.js
      - name: Tester ouverture obligatoire et fermeture facultative
        run: |
          node - <<'NODE'
          const {normalizeSchedules,evaluateBoothLock}=require('./lib/boothLockScheduler');
          const schedules=normalizeSchedules([{id:'event',kind:'once',startAt:'2026-09-19T19:00',endAt:null}]);
          if(schedules.length!==1||schedules[0].endAt!==null) throw new Error('Fermeture facultative non normalisee');
          const waiting=evaluateBoothLock({schedules,nowISO:'2026-09-19T18:59:00'});
          if(waiting.state!=='WAITING'||!waiting.locked||!waiting.nextOpenAt) throw new Error('Attente avant ouverture invalide');
          const open=evaluateBoothLock({schedules,nowISO:'2026-09-19T19:01:00'});
          if(open.state!=='OPEN'||open.locked||open.currentCloseAt!==null) throw new Error('Ouverture sans fermeture invalide');
          const later=evaluateBoothLock({schedules,nowISO:'2026-09-20T03:00:00'});
          if(later.state!=='OPEN'||later.locked) throw new Error('La borne ne reste pas ouverte sans fermeture');
          const power=evaluateBoothLock({schedules,manualOverride:'LOCK',nowISO:'2026-09-20T03:01:00'});
          if(power.state!=='MANUAL_LOCK'||!power.locked) throw new Error('Fin Power/verrouillage invalide');
          console.log('LP28 V3 fermeture facultative: OK');
          NODE
      - name: Verifier le contrat PIN serveur vers Agent
        run: node scripts/test-lock-pin-server-contract.js
      - name: Verifier la syntaxe des patches verrouillage
        run: node --check scripts/patch-booth-lock-ui-v2.js && node --check scripts/patch-lock-schedule-save-confirm.js && node --check scripts/patch-lock-sync-runtime.js
      - name: Verifier le raccordement au build
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const build=String(pkg.scripts?.build||'');
          const pro='node scripts/patch-booths-pro-dashboard.js';
          const v2='node scripts/patch-booth-lock-ui-v2.js';
          const save='node scripts/patch-lock-schedule-save-confirm.js';
          const runtime='node scripts/patch-lock-sync-runtime.js';
          for(const x of [v2,save,runtime]) if(!build.includes(x)) throw new Error(x+' absent du build');
          if(!(build.indexOf(pro)<build.indexOf(v2)&&build.indexOf(v2)<build.indexOf(save)&&build.indexOf(save)<build.indexOf(runtime))) throw new Error('ordre patches verrouillage invalide');
          console.log('LP28 ordre build verrouillage valide');
          NODE
      - name: Simuler la chaine reelle des patches Mes Bornes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/patch-booth-status-fix.js
          node scripts/patch-booth-power-client.js
          node scripts/patch-booth-lock-schedule.js
          node scripts/fix-booths-pro-dashboard-syntax.js
          node scripts/patch-booths-pro-dashboard.js
          node scripts/patch-booth-lock-ui-v2.js
          node scripts/patch-lock-schedule-save-confirm.js
          node scripts/patch-lock-sync-runtime.js
          node --check server.js
          node - <<'NODE'
          const fs=require('fs');
          const server=fs.readFileSync('server.js','utf8');
          const app=fs.readFileSync('client/src/App.jsx','utf8');
          const checks=[
            [server.includes('/api/admin/booths/:boothName/lock-schedules'),'API lock-schedules absente'],
            [server.includes('/api/admin/booths/:boothName/lock-history'),'API historique absente'],
            [server.includes('schedules:Array.isArray(p?.lockScreen?.schedules)?p.lockScreen.schedules:[]'),'schedules non conserves'],
            [server.includes('LOCK CONFIG SAVED'),'trace sauvegarde absente'],
            [server.includes('SCHEDULE_SAVED'),'historique programmation absent'],
            [server.includes('endAt:endAt||null'),'fermeture facultative non conservee'],
            [app.includes('function LP28LockScheduleEditor('),'editeur verrouillage absent'],
            [app.includes('Renseigne l’ouverture du créneau'),'ouverture obligatoire non validee'],
            [app.includes('Fermeture automatique (facultative)'),'libelle fermeture facultative absent'],
            [app.includes('Créneaux enregistrés avec succès'),'confirmation sauvegarde absente']
          ];
          for(const [ok,msg] of checks) if(!ok) throw new Error(msg);
          console.log('LP28 chaine verrouillage V3 complete: OK');
          NODE
