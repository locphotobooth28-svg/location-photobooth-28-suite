name: Apply LP28 printer supervision patch

on:
  push:
    branches:
      - feature/lp28-agent-v2.7.19-dnp-supervision
    paths:
      - scripts/apply-lp28-printer-supervision-v2.7.19.mjs
      - .github/workflows/apply-lp28-printer-supervision.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/lp28-agent-v2.7.19-dnp-supervision
          fetch-depth: 0

      - name: Apply idempotent LP28 patch
        run: node scripts/apply-lp28-printer-supervision-v2.7.19.mjs

      - name: Verify changed JavaScript parses
        run: |
          node --check server.js
          node --check scripts/apply-lp28-printer-supervision-v2.7.19.mjs

      - name: Commit generated application changes
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "LP28 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add server.js client/src/App.jsx
          git commit -m "feat: integrate printer telemetry into LP28 admin"
          git push origin HEAD:feature/lp28-agent-v2.7.19-dnp-supervision
