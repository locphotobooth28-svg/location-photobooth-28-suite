name: LP28 Booth Usage One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lp28-booth-usage-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch client/src/App.jsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('client/src/App.jsx')
          text = path.read_text(encoding='utf-8-sig')

          if 'const boothUsage=useMemo' in text:
              raise SystemExit('boothUsage existe déjà : arrêt de sécurité')

          logic_anchor = '''  function eventBooths(event){'''
          logic_insert = '''  const boothUsage=useMemo(()=>{
            const rows={
              LOLA:{label:"Lola",week:0,month:0,year:0,total:0},
              NINA:{label:"Nina",week:0,month:0,year:0,total:0},
              GABIN:{label:"Gabin",week:0,month:0,year:0,total:0}
            };

            const now=new Date(weekClock);
            now.setHours(12,0,0,0);
            const weekStart=startOfLp28Week(now);
            const weekEnd=addLp28Days(weekStart,7);
            const monthStart=new Date(now.getFullYear(),now.getMonth(),1,12,0,0,0);
            const monthEnd=new Date(now.getFullYear(),now.getMonth()+1,1,12,0,0,0);
            const yearStart=new Date(now.getFullYear(),0,1,12,0,0,0);
            const yearEnd=new Date(now.getFullYear()+1,0,1,12,0,0,0);

            events.forEach(event=>{
              if(["CANCELLED","DECLINED"].includes(String(event?.bookingStatus||"").toUpperCase()))return;
              const d=parseLp28EventDate(event?.date);
              if(!d)return;
              eventBooths(event).forEach(booth=>{
                if(!rows[booth])return;
                rows[booth].total+=1;
                if(d>=weekStart&&d<weekEnd)rows[booth].week+=1;
                if(d>=monthStart&&d<monthEnd)rows[booth].month+=1;
                if(d>=yearStart&&d<yearEnd)rows[booth].year+=1;
              });
            });

            const list=[rows.LOLA,rows.NINA,rows.GABIN];
            const total=list.reduce((acc,row)=>({
              week:acc.week+row.week,
              month:acc.month+row.month,
              year:acc.year+row.year,
              total:acc.total+row.total
            }),{week:0,month:0,year:0,total:0});

            return {rows:list,total};
          },[events,weekClock]);

          function eventBooths(event){'''

          if text.count(logic_anchor) != 1:
              raise SystemExit(f'Point logique attendu 1 fois, trouvé {text.count(logic_anchor)}')
          text = text.replace(logic_anchor, logic_insert, 1)

          ui_anchor = '''        <section className="panel dashboard-panel"><div><div className="panel-kicker">GESTION DES ÉVÉNEMENTS</div><h2>Prépare tes prestations en quelques clics</h2><p>Crée un événement, sélectionne le matériel réservé et récupère immédiatement les liens organisateur et invités ainsi que le QR Code.</p><button className="primary" onClick={()=>setView("events")}>Voir mes événements</button></div><img src="/logo-hd.png"/></section>'''

          ui_insert = '''        {isAdmin&&<section className="panel" style={{marginTop:16,padding:0,overflow:"hidden"}}>
            <div style={{padding:"18px 20px 14px",display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:14,flexWrap:"wrap",borderBottom:"1px solid rgba(148,163,184,.16)"}}>
              <div>
                <div className="panel-kicker">SUIVI DU MATÉRIEL</div>
                <h2 style={{margin:"4px 0 4px"}}>📸 Utilisation des bornes</h2>
                <p className="muted" style={{margin:0}}>Nombre de prestations affectées à chaque borne.</p>
              </div>
              <div style={{padding:"7px 10px",borderRadius:999,border:"1px solid rgba(96,165,250,.28)",background:"rgba(59,130,246,.08)",fontSize:12,fontWeight:800,color:"#93c5fd"}}>Hors événements annulés / refusés</div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",minWidth:640}}>
                <thead><tr style={{background:"rgba(148,163,184,.08)"}}>
                  <th style={{textAlign:"left",padding:"12px 16px"}}>Borne</th>
                  <th style={{textAlign:"center",padding:"12px 16px"}}>Cette semaine</th>
                  <th style={{textAlign:"center",padding:"12px 16px"}}>Ce mois-ci</th>
                  <th style={{textAlign:"center",padding:"12px 16px"}}>Cette année</th>
                  <th style={{textAlign:"center",padding:"12px 16px"}}>Total</th>
                </tr></thead>
                <tbody>
                  {boothUsage.rows.map((row,index)=>{
                    const accent=index===0?"#f472b6":index===1?"#38bdf8":"#4ade80";
                    return <tr key={row.label} style={{borderTop:"1px solid rgba(148,163,184,.12)"}}>
                      <td style={{padding:"13px 16px",fontWeight:900,color:accent}}>🖥️ {row.label}</td>
                      <td style={{padding:"13px 16px",textAlign:"center",fontWeight:800}}>{row.week}</td>
                      <td style={{padding:"13px 16px",textAlign:"center",fontWeight:800}}>{row.month}</td>
                      <td style={{padding:"13px 16px",textAlign:"center",fontWeight:800}}>{row.year}</td>
                      <td style={{padding:"13px 16px",textAlign:"center",fontWeight:950}}>{row.total}</td>
                    </tr>
                  })}
                  <tr style={{borderTop:"1px solid rgba(214,185,79,.38)",background:"rgba(214,185,79,.06)"}}>
                    <td style={{padding:"13px 16px",fontWeight:950}}>Total</td>
                    <td style={{padding:"13px 16px",textAlign:"center",fontWeight:950}}>{boothUsage.total.week}</td>
                    <td style={{padding:"13px 16px",textAlign:"center",fontWeight:950}}>{boothUsage.total.month}</td>
                    <td style={{padding:"13px 16px",textAlign:"center",fontWeight:950}}>{boothUsage.total.year}</td>
                    <td style={{padding:"13px 16px",textAlign:"center",fontWeight:950,color:"#f4c542"}}>{boothUsage.total.total}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>}

          <section className="panel dashboard-panel"><div><div className="panel-kicker">GESTION DES ÉVÉNEMENTS</div><h2>Prépare tes prestations en quelques clics</h2><p>Crée un événement, sélectionne le matériel réservé et récupère immédiatement les liens organisateur et invités ainsi que le QR Code.</p><button className="primary" onClick={()=>setView("events")}>Voir mes événements</button></div><img src="/logo-hd.png"/></section>'''

          if text.count(ui_anchor) != 1:
              raise SystemExit(f'Point UI attendu 1 fois, trouvé {text.count(ui_anchor)}')
          text = text.replace(ui_anchor, ui_insert, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies without postinstall
        run: npm ci --ignore-scripts

      - name: Build client
        run: npm run build

      - name: Commit LP28 change and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/lp28-booth-usage-once.yml
          git config user.name "LP28 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add client/src/App.jsx .github/workflows/lp28-booth-usage-once.yml
          git commit -m "LP28 : ajout utilisation des bornes au tableau de bord"
          git push origin main
