name: Apply contract section order

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-contract-section-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reorder contract sections
        run: node scripts/reorder-contract-sections.js

      - name: Verify syntax and section order
        run: |
          node --check contractService.js
          node --check services/contractService.js
          grep -n "section(3,\"Forfait d'impression\")" contractService.js services/contractService.js
          grep -n "section(4,\"Conditions de location\")" contractService.js services/contractService.js
          grep -n "section(5,\"Règlement et dépôt de garantie\")" contractService.js services/contractService.js

      - name: Commit changes
        run: |
          git config user.name "LP28 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add contractService.js services/contractService.js
          git commit -m "feat: reorder contract sections 3 to 5"
          git push origin main
