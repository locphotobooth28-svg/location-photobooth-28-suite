name: LP28 travel rate patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lp28-travel-rate-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch travel rate handling
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path('App.jsx'), Path('client/src/App.jsx')]

          old_fee = '''const getTravelFee = (preparation) => {
            const p = preparation && typeof preparation === "object" ? preparation : {};
            const distance = Math.max(Number(p.travelDistanceKm || 0), 0);
            const freeKm = p.travelFree15 ? 15 : 0;
            return Math.max(distance - freeKm, 0) * 0.50;
          };'''

          new_fee = '''const getTravelFee = (preparation) => {
            const p = preparation && typeof preparation === "object" ? preparation : {};
            const distance = Math.max(Number(p.travelDistanceKm || 0), 0);
            const freeKm = p.travelFree15 ? 15 : 0;
            // Compatibilité : un ancien événement sans tarif enregistré reste à 0,50 €/km.
            const rate = Number.isFinite(Number(p.travelRate)) ? Math.max(Number(p.travelRate), 0) : 0.50;
            return Math.max(distance - freeKm, 0) * rate;
          };'''

          old_with_fee = '''const withTravelFee = (basePrice, preparation) =>
            Number(basePrice || 0) + getTravelFee(preparation);'''

          new_with_fee = '''const withTravelFee = (basePrice, preparation) =>
            Number(basePrice || 0) + getTravelFee(preparation);

          const withTravelRateChange = (form, rate) => {
            const oldPrep = form?.preparation || {};
            const oldFee = getTravelFee(oldPrep);
            const numericRate = Number(rate);
            const nextRate = Number.isFinite(numericRate)
              ? Math.max(Math.round(numericRate * 100) / 100, 0)
              : 0;
            const newPrep = {...oldPrep, travelRate: nextRate};
            const newFee = getTravelFee(newPrep);
            newPrep.travelFee = Number(newFee.toFixed(2));
            const base = Math.max(Number(form?.totalPrice || 0) - oldFee, 0);
            const total = base + newFee;
            return {
              ...form,
              preparation: newPrep,
              totalPrice: total.toFixed(2),
              balance: Math.max(total - Number(form?.deposit || 0), 0).toFixed(2)
            };
          };'''

          rate_block_re = re.compile(
            r'(?P<indent>[ \t]*)<div>\s*\n'
            r'[ \t]*<label>Tarif déplacement</label>\s*\n'
            r'[ \t]*<input\b[^>]*\breadOnly\b[^>]*/>\s*\n'
            r'[ \t]*</div>'
          )

          rate_block_body = '''<div>
            <label>Tarif déplacement</label>
            <div style={{display:"grid",gridTemplateColumns:"44px minmax(120px,1fr) 44px",gap:8,alignItems:"center"}}>
              <button
                type="button"
                className="ghost"
                aria-label="Diminuer le tarif de déplacement"
                onClick={()=>setForm(f=>withTravelRateChange(f, Math.max(Number(f.preparation?.travelRate ?? 0.50) - 0.05, 0)))}
              >−</button>
              <input
                type="number"
                min="0"
                step="0.05"
                value={form.preparation?.travelRate ?? 0.50}
                onChange={e=>setForm(f=>withTravelRateChange(f,e.target.value))}
                style={{textAlign:"center"}}
              />
              <button
                type="button"
                className="ghost"
                aria-label="Augmenter le tarif de déplacement"
                onClick={()=>setForm(f=>withTravelRateChange(f, Number(f.preparation?.travelRate ?? 0.50) + 0.05))}
              >+</button>
            </div>
            <div className="muted" style={{fontSize:12,marginTop:5}}>Tarif propre à cette prestation • les autres événements ne changent pas</div>
          </div>'''

          def indent_block(block, indent):
            lines = block.splitlines()
            return '\n'.join(indent + line if line else line for line in lines)

          for path in files:
            text = path.read_text(encoding='utf-8')
            original = text

            if old_fee not in text:
              raise SystemExit(f'{path}: bloc getTravelFee attendu introuvable')
            text = text.replace(old_fee, new_fee)

            if old_with_fee not in text:
              raise SystemExit(f'{path}: bloc withTravelFee attendu introuvable')
            text = text.replace(old_with_fee, new_with_fee)

            marker = 'preparation:{materialChecked:false'
            if marker not in text:
              raise SystemExit(f'{path}: EMPTY_EVENT preparation introuvable')
            text = text.replace(marker, 'preparation:{travelRate:0.70,materialChecked:false', 1)

            distance_old = 'const newPrep={...oldPrep,travelDistanceKm:value,travelRate:0.50};'
            free_old = 'const newPrep={...oldPrep,travelFree15:e.target.checked,travelRate:0.50};'
            if distance_old not in text or free_old not in text:
              raise SystemExit(f'{path}: gestion distance/15 km attendue introuvable')
            text = text.replace(
              distance_old,
              'const newPrep={...oldPrep,travelDistanceKm:value,travelRate:Number.isFinite(Number(oldPrep.travelRate))?Number(oldPrep.travelRate):0.50};'
            )
            text = text.replace(
              free_old,
              'const newPrep={...oldPrep,travelFree15:e.target.checked,travelRate:Number.isFinite(Number(oldPrep.travelRate))?Number(oldPrep.travelRate):0.50};'
            )

            def repl(m):
              return indent_block(rate_block_body, m.group('indent'))

            text, count = rate_block_re.subn(repl, text)
            if count < 1:
              idx = text.find('Tarif déplacement')
              context = text[max(0,idx-300):idx+500] if idx >= 0 else 'libellé absent'
              raise SystemExit(f'{path}: champ Tarif déplacement introuvable. Contexte: {context!r}')

            if text == original:
              raise SystemExit(f'{path}: aucune modification appliquée')
            path.write_text(text, encoding='utf-8')
            print(f'{path}: OK ({count} bloc(s) tarif remplacé(s))')

      - name: Verify patch
        run: |
          grep -n "const rate = Number.isFinite(Number(p.travelRate))" App.jsx client/src/App.jsx
          grep -n "Tarif propre à cette prestation" App.jsx client/src/App.jsx
          grep -n "travelRate:0.70" App.jsx client/src/App.jsx

      - name: Commit patch
        run: |
          git config user.name "LP28 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add App.jsx client/src/App.jsx
          git commit -m "feat: make travel rate configurable per event"
          git push origin main
