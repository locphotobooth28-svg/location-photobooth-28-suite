# One-off patch workflow for LP28 contract wording/order
name: LP28 contract conditions patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lp28-contract-conditions-order.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch contract generator
        shell: python
        run: |
          from pathlib import Path

          files = [Path('contractService.js'), Path('services/contractService.js')]

          duration_anchor = '''  drawText(
            `Le matériel est loué du ${dateFr(event.eventDate)} au ${
              event.pickupDate
                ? dateFr(event.pickupDate)
                : dateFr(event.eventDate)
            }.`
          );'''

          duration_extra = duration_anchor + '''

          drawText(
            "Le matériel est mis à disposition pour une durée maximale de 24 heures, sauf disposition contraire prévue au devis. Cette durée peut être inférieure selon les horaires, l'organisation de l'événement, les contraintes du lieu ou les modalités convenues avec le client. Elle peut également être supérieure à 24 heures lorsqu'une option ou une durée complémentaire est expressément prévue au devis ou au contrat de location."
          );

          drawText(
            "Les horaires exacts de livraison, d'installation et de reprise sont définis en fonction de l'organisation de la prestation et ne correspondent pas nécessairement à une période de 24 heures pleines."
          );'''

          old_total_then_travel = '''  drawText(
            `Montant total de la prestation : ${money(event.totalPrice)}.`,
            {
              size:11,
              fontUsed:bold,
              gapAfter:6
            }
          );

          drawText(
            "Le montant total enregistré dans la prestation prévaut sur les tarifs catalogue en cas de remise, offre commerciale, prestation professionnelle ou conditions particulières."
          );

          const travel = event.preparation && typeof event.preparation === "object"
            ? event.preparation
            : {};
          const travelDistance = Math.max(Number(travel.travelDistanceKm || 0), 0);
          const travelFreeKm = travel.travelFree15 ? 15 : 0;
          const travelRate = 0.50;
          const travelFee = Math.max(travelDistance - travelFreeKm, 0) * travelRate;

          if(travelDistance > 0){
            drawText(
              `Frais de déplacement : ${money(travelFee)}${travel.travelFree15 ? " (15 km offerts appliqués)" : ""}.`,
              { fontUsed:bold }
            );
          }'''

          new_travel_then_total = '''  const travel = event.preparation && typeof event.preparation === "object"
            ? event.preparation
            : {};
          const travelDistance = Math.max(Number(travel.travelDistanceKm || 0), 0);
          const travelFreeKm = travel.travelFree15 ? 15 : 0;
          const travelRate = Number.isFinite(Number(travel.travelRate))
            ? Math.max(Number(travel.travelRate), 0)
            : 0.50;
          const travelFee = Math.max(travelDistance - travelFreeKm, 0) * travelRate;

          if(travelDistance > 0){
            drawText(
              `Frais de déplacement : ${money(travelFee)}${travel.travelFree15 ? " (15 km offerts appliqués)" : ""}.`,
              { fontUsed:bold, gapAfter:5 }
            );
          }

          drawText(
            `Montant total de la prestation : ${money(event.totalPrice)}.`,
            {
              size:11,
              fontUsed:bold,
              gapAfter:6
            }
          );

          drawText(
            "Le montant total enregistré dans la prestation prévaut sur les tarifs catalogue en cas de remise, offre commerciale, prestation professionnelle ou conditions particulières."
          );'''

          for path in files:
            text = path.read_text(encoding='utf-8')

            if "Le matériel est mis à disposition pour une durée maximale de 24 heures" not in text:
              if duration_anchor not in text:
                raise SystemExit(f'{path}: ancre durée introuvable')
              text = text.replace(duration_anchor, duration_extra, 1)

            if old_total_then_travel in text:
              text = text.replace(old_total_then_travel, new_travel_then_total, 1)
            elif "const travelRate = Number.isFinite(Number(travel.travelRate))" not in text:
              raise SystemExit(f'{path}: bloc frais de déplacement attendu introuvable')

            path.write_text(text, encoding='utf-8')
            print(f'{path}: OK')

      - name: Verify patch
        run: |
          grep -n "durée maximale de 24 heures" contractService.js services/contractService.js
          grep -n "const travelRate = Number.isFinite(Number(travel.travelRate))" contractService.js services/contractService.js
          node --check contractService.js
          node --check services/contractService.js

      - name: Commit patch
        run: |
          git config user.name "LP28 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add contractService.js services/contractService.js
          git commit -m "feat: clarify rental duration and reorder contract travel fees"
          git push origin main
