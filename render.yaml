services:
  - type: web
    name: location-photobooth-28-suite
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_TOKEN_KEY
        sync: false
      - key: GOOGLE_TIMEZONE
        value: Europe/Paris
      - key: GOOGLE_CALENDAR_ID
        value: primary
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
